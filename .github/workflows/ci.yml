name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # No dotnet-version here on purpose: setup-dotnet reads global.json,
      # so the SDK version lives in exactly one place.
      - uses: actions/setup-dotnet@v4
      - name: Build
        run: dotnet build GameOfLife.sln --configuration Release
      - name: Test
        run: dotnet test GameOfLife.sln --configuration Release --no-build
      - name: Check formatting
        run: dotnet format GameOfLife.sln --verify-no-changes
